globals:
  - id: show_welcome_screen
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: heater_on
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: heater_power_when_on
    type: float
    restore_value: yes
    initial_value: '0'
  - id: first_measurement_done
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: manual_watchdog_counter
    type: int
    restore_value: no
    initial_value: '0'

esphome:
  name: power-regulator
  friendly_name: power_regulator
  on_boot: 
    priority: -100
    then:
      - delay: 5s
      - globals.set: 
          id: show_welcome_screen
          value: 'false'
      - lambda: |-
          id(my_display).set_update_interval(1000);  
          id(oled_display).set_update_interval(1000);
esp32:
  board: esp32dev
  framework:
    type: arduino
    sdkconfig_options:
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "32768"
      CONFIG_ESP_WIFI_TASK_WDT_TIMEOUT_MS: "10000"
      CONFIG_ESP_SYSTEM_EVENT_TASK_STACK_SIZE: "4096"
      CONFIG_PM_ENABLE: "n"
  flash_size: 4MB
# Enable logging
logger:
  level: INFO
  hardware_uart: UART0
  baud_rate: 115200
  
# Enable Home Assistant API
api:
  encryption:
    key: "kh2Llsu6ld7kAa9XHPMhcIEAktdSRqP6/Xdh7krXkVo="

ota:
  - platform: esphome
    password: "123456"
web_server:
  port: 80
  auth: 
    username: admin
    password: 'admin'
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Power-Regulator Fallback Hotspot"
    password: "YWuCdG1qEHew"
spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
i2c:
  sda: GPIO26  # Zmienione z GPIO21
  scl: GPIO27  # Nowy pin
  scan: true
  id: bus_a

time:
  - platform: homeassistant
    id: s_time
    timezone: "Europe/Warsaw"
output:
  - platform: slow_pwm
    pin: GPIO25
    id: regulator_pwm
    period: 30000ms  # 30s - czas na stabilizację systemu
    turn_on_action:
      - globals.set:
          id: heater_on
          value: 'true'
    turn_off_action:
      - globals.set:
          id: heater_on
          value: 'false'
font:
  - file: "Font/arial.ttf"
    id: font1
    size: 10 
  - file: "Font/Lexend-Regular.ttf"
    id: font2
  - file: "Font/arial.ttf"
    id: font3
    size: 14
  - file: "Font/Lexend-Regular.ttf"
    id: font4
    size: 14

image:
  - file: "images/monika2.png"
    id: monika
    type: BINARY
    
number:
  - platform: template
    name: "Regulator Mocy"
    id: moc_suwak
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    initial_value: 0
    optimistic: true
    # Akcja wykonywana przy przesunięciu suwaka w HA
    set_action:
      then:
        - output.set_level:
            id: regulator_pwm
            level: !lambda "return x / 100.0;"

  - platform: template
    name: "Watchdog Timeout"
    id: watchdog_timeout_min
    min_value: 5
    max_value: 120
    step: 5
    unit_of_measurement: "min"
    initial_value: 30
    optimistic: true
    restore_value: true

interval:
  - interval: 2s
    then:
      - lambda: |-
          float duty = id(moc_suwak).state;
          bool ha_connected = api_is_connected();
          bool in_manual_mode = !id(auto_mode).state;
          bool sensors_valid = id(ne_power).has_state() && id(ev_power).has_state();

          // ═══════════════════════════════════════════════════════════
          // WATCHDOG: MANUAL + brak HA + grzałka ON
          // ═══════════════════════════════════════════════════════════
          if (in_manual_mode && !ha_connected && duty > 0) {
            id(manual_watchdog_counter) += 2;
            int timeout_sec = (int)(id(watchdog_timeout_min).state * 60);
            int remaining = timeout_sec - id(manual_watchdog_counter);

            // Ostrzeżenie 5 min przed
            if (remaining == 300) {
              ESP_LOGW("watchdog", "5 minutes remaining before auto-shutoff!");
            }

            // TIMEOUT
            if (id(manual_watchdog_counter) >= timeout_sec) {
              auto call = id(moc_suwak).make_call();
              call.set_value(0);
              call.perform();
              ESP_LOGE("watchdog", "TIMEOUT! Heater disabled - no HA connection for %d min",
                       timeout_sec / 60);
              id(manual_watchdog_counter) = 0;  // Reset po wyłączeniu
              return;
            }
          } else {
            // Reset gdy: AUTO lub HA połączony lub grzałka OFF
            if (id(manual_watchdog_counter) > 0) {
              ESP_LOGI("watchdog", "Watchdog reset (HA=%s, AUTO=%s, duty=%.0f%%)",
                       ha_connected ? "yes" : "no",
                       in_manual_mode ? "no" : "yes",
                       duty);
              id(manual_watchdog_counter) = 0;
            }
          }

          // ═══════════════════════════════════════════════════════════
          // BEZPIECZEŃSTWO: Przekroczenie temperatury → wyłącz grzałkę
          // ═══════════════════════════════════════════════════════════
          if (id(shtc3_temperature).has_state()) {
            float max_temp = id(max_temperature).has_state() ? id(max_temperature).state : 40.0;

            if (id(shtc3_temperature).state > max_temp) {
              id(boiler_avg_power).publish_state(0);
              id(boiler_actual_power).publish_state(id(heater_power_when_on));
              auto call = id(moc_suwak).make_call();
              call.set_value(0);
              call.perform();
              ESP_LOGE("heater", "TEMPERATURE ALARM! %.1f°C > %.1f°C - heater disabled%s",
                       id(shtc3_temperature).state, max_temp,
                       id(max_temperature).has_state() ? "" : " (default limit)");
              return;
            }
          }

          // ═══════════════════════════════════════════════════════════
          // BEZPIECZEŃSTWO: Brak połączenia z HA w trybie AUTO
          // ═══════════════════════════════════════════════════════════
          if (!ha_connected && id(auto_mode).state) {
            id(boiler_avg_power).publish_state(0);
            id(boiler_actual_power).publish_state(id(heater_power_when_on));
            auto call = id(moc_suwak).make_call();
            call.set_value(0);
            call.perform();
            ESP_LOGW("heater", "HA disconnected in AUTO mode - heater disabled");
            return;
          }

          // ═══════════════════════════════════════════════════════════
          // POMIAR MOCY
          // ═══════════════════════════════════════════════════════════
          if (!sensors_valid) {
            ESP_LOGW("heater", "Sensors not valid - using last known values");
          }

          float ne = id(ne_power).has_state() ? id(ne_power).state : 0;
          float ev = id(ev_power).has_state() ? id(ev_power).state : 0;
          float nominal = 5000.0;

          if (!id(first_measurement_done)) {
            id(heater_power_when_on) = nominal;
          }

          if (duty > 0) {
            if (id(heater_on) && ha_connected && sensors_valid) {
              float measured = ne - ev;
              if (measured > 0 && measured > 100 && measured <= nominal * 1.1) {
                id(heater_power_when_on) = measured;
                id(first_measurement_done) = true;
              }
            }

            float avg_power = id(heater_power_when_on) * (duty / 100.0);
            id(boiler_avg_power).publish_state(avg_power);
          } else {
            id(boiler_avg_power).publish_state(0);
          }

          id(boiler_actual_power).publish_state(id(heater_power_when_on));

captive_portal:
sensor:
  - platform: wifi_signal
    id: wifi_rssi
    update_interval: 20s # Częste odświeżanie dla podglądu na żywo

  - platform: homeassistant
    id: eastron_power
    entity_id: sensor.dom_power_total
    internal: false 
    filters: 
      - heartbeat: 3s 
  - platform: homeassistant
    id: eastron_power_2
    entity_id: sensor.sdm630_total_system_power
    internal: false
    filters:
      - heartbeat: 3s
  - platform: homeassistant
    id: ne_power
    entity_id: sensor.ne_total_system_power
    internal: false
    filters:
      - heartbeat: 3s
  - platform: homeassistant
    id: ev_power
    entity_id: sensor.shellypro3em_ev_moc
    internal: false
    filters:
      - heartbeat: 3s
  - platform: homeassistant
    id: max_temperature
    entity_id: input_number.power_regulator_max_temperature
    internal: false
  - platform: shtcx
    temperature:
      name: "Temperatura"
      id: shtc3_temperature
      filters:
        - offset: 0.0  # Kalibracja jeśli potrzebna
    humidity:
      name: "Wilgotność"
      id: shtc3_humidity
      filters:
        - offset: 0.0  # Kalibracja jeśli potrzebna
    address: 0x70
    update_interval: 10s  # Odświeżanie co 10 sekund

  - platform: template
    name: "Bojler Średnia Moc"
    id: boiler_avg_power
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  - platform: template
    name: "Bojler Moc Rzeczywista"
    id: boiler_actual_power
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  - platform: template
    name: "Watchdog Pozostały Czas"
    id: watchdog_remaining
    unit_of_measurement: "min"
    accuracy_decimals: 1
    lambda: |-
      bool in_manual = !id(auto_mode).state;
      bool ha_connected = api_is_connected();
      if (!in_manual || ha_connected || id(moc_suwak).state == 0) {
        return 0;
      }
      int timeout_sec = (int)(id(watchdog_timeout_min).state * 60);
      int remaining = timeout_sec - id(manual_watchdog_counter);
      return remaining > 0 ? remaining / 60.0 : 0;

display:
  - platform: ssd1322_spi
    model: "SSD1322 256x64"
    id: my_display
    dc_pin: GPIO16
    cs_pin: GPIO14
    reset_pin: GPIO17
    data_rate: 8M
    update_interval: 0.1s
    brightness: 0.5
    lambda: |-
      auto time = id(s_time).now();
      static const char *const DAYS[] = {"Niedziela", "Poniedzialek", "Wtorek", "Sroda", "Czwartek", "Piatek", "Sobota"};
      float rssi = id(wifi_rssi).state;
      int x_pos = 240; 
      int y_pos = 10;
      const int X_RIGHT = 252;
      const int X_LEFT = 105;
      const int Y_GRID = 10;
      const int Y_DOM = 27;
      const int Y_BOJ = 43;
      const char* text_wait_ha="Czekam na HomeAssistant";
      
      if (id(show_welcome_screen)) {
        it.image(0,0,id(monika));
        int scroll_x = max(96,256 - (int)((millis() / 15) % 450));
        int text_start_y = 15;
        it.printf(scroll_x, text_start_y, id(font3), TextAlign::TOP_LEFT, "POWER REGULATOR");
        it.printf(scroll_x, text_start_y + 22, id(font1), TextAlign::TOP_LEFT, "Witaj w systemie!");
        it.printf(scroll_x, text_start_y + 37, id(font1), TextAlign::TOP_LEFT, "Inicjalizacja...");
      } else if (id(temperature_alarm).state) {
        // ALARM TEMPERATURY - pełnoekranowy
        float max_temp = id(max_temperature).has_state() ? id(max_temperature).state : 40.0;

        // Migająca ramka (co 500ms)
        if ((millis() / 500) % 2 == 0) {
          it.rectangle(0, 0, 256, 64);
          it.rectangle(1, 1, 254, 62);
        }

        // Nagłówek alarmu
        it.printf(128, 5, id(font3), TextAlign::TOP_CENTER, "!! ALARM TEMPERATURY !!");

        // Aktualna temperatura
        if (id(shtc3_temperature).has_state()) {
          it.printf(128, 25, id(font4), TextAlign::TOP_CENTER, "Temp: %.1f C", id(shtc3_temperature).state);
        }

        // Limit
        it.printf(128, 42, id(font1), TextAlign::TOP_CENTER, "Limit: %.1f C - Grzalka WYLACZONA", max_temp);

      } else {
        if(network::is_connected()){
          it.printf(0,0, id(font1), TextAlign::TOP_LEFT, "IP: %s", id(my_ip_adress).state.c_str());
        }  else {
          it.print(0, 0, id(font1), TextAlign::TOP_LEFT, "IP: Brak...");
        }
        if (id(wifi_rssi).has_state()) {
          if (rssi >= -80) it.filled_rectangle(x_pos,      y_pos-2, 2, 2); 
          if (rssi >= -70) it.filled_rectangle(x_pos + 3,  y_pos-4, 2, 4); 
          if (rssi >= -60) it.filled_rectangle(x_pos + 6,  y_pos-6, 2, 6); 
          if (rssi >= -50) it.filled_rectangle(x_pos + 9,  y_pos-8, 2, 8); 

          if (id(wifi_ssid_sensor).has_state()) {
          it.printf(x_pos - 5, 0, id(font1), TextAlign::TOP_RIGHT, "%s [%.0f dBm]", 
                    id(wifi_ssid_sensor).state.c_str(), id(wifi_rssi).state);
          } else {
            it.print(0, 0, id(font1), TextAlign::TOP_LEFT, "WiFi: Rozlaczono");
          }
        } else {
          it.print(x_pos, 0, id(font1), "!");
        }
        if(!time.is_valid()) {
          int text_width = 400;
          int screen_width = 256;
          int x_pos = screen_width - ((millis() / 20) % (screen_width + text_width));
          it.print(x_pos, 30, id(font3), TextAlign::TOP_LEFT, text_wait_ha);

        } else {
          it.strftime(0, Y_GRID, id(font2), TextAlign::TOP_LEFT, "%H:%M:%S", time);
          it.print(0, 30, id(font1), TextAlign::TOP_LEFT, DAYS[time.day_of_week - 1]);
        
          it.rectangle(0, 43, 96, 8);
          float bar_width = (id(moc_suwak).state / 100.0) * 94.0;
          it.filled_rectangle(1, 44, (int)bar_width, 6);

          // Watchdog aktywny: MANUAL + brak HA + grzałka ON
          bool wdg_active = !id(auto_mode).state && !api_is_connected() && id(moc_suwak).state > 0;

          if (wdg_active) {
            int timeout_sec = (int)(id(watchdog_timeout_min).state * 60);
            int remaining_sec = timeout_sec - id(manual_watchdog_counter);
            int remaining_min = remaining_sec / 60;

            // Miganie gdy < 5 min
            if (remaining_min < 5) {
              if ((millis() / 400) % 2 == 0) {
                it.printf(1, 52, id(font1), TextAlign::TOP_LEFT, "WDG: %d min! Moc:%.0f%%", remaining_min, id(moc_suwak).state);
              }
            } else {
              it.printf(1, 52, id(font1), TextAlign::TOP_LEFT, "WDG: %d min  Moc:%.0f%%", remaining_min, id(moc_suwak).state);
            }
          } else {
            const char* mode_str = id(auto_mode).state ? "AUTO" : "MANUAL";
            it.printf(1, 52, id(font1), TextAlign::TOP_LEFT, "[%s] Moc: %.0f%%", mode_str, id(moc_suwak).state);
          }

          it.printf(X_LEFT, Y_DOM, id(font2), TextAlign::TOP_LEFT, "Dom:");
          it.printf(X_LEFT, Y_BOJ, id(font2), TextAlign::TOP_LEFT, "Boj.:");
          it.printf(X_LEFT, Y_GRID, id(font2), TextAlign::TOP_LEFT, "Grid:");

          // Dom
          if(id(eastron_power).has_state()){
            it.printf(X_RIGHT, Y_DOM, id(font2), TextAlign::TOP_RIGHT, "%.0f W", id(eastron_power).state);
          } else {
            it.printf(X_RIGHT, Y_DOM, id(font2), TextAlign::TOP_RIGHT, "no data");
          }

          // Bojler - średnia moc z uwzględnieniem duty cycle
          if(id(boiler_avg_power).has_state()){
            it.printf(X_RIGHT, Y_BOJ, id(font2), TextAlign::TOP_RIGHT, "%.0f W", id(boiler_avg_power).state);
          } else {
            it.printf(X_RIGHT, Y_BOJ, id(font2), TextAlign::TOP_RIGHT, "no data");
          }

          // Grid
          if(id(eastron_power_2).has_state()){
            it.printf(X_RIGHT, Y_GRID, id(font2), TextAlign::TOP_RIGHT, "%.0f W", id(eastron_power_2).state);
          } else {
            it.printf(X_RIGHT, Y_GRID, id(font2), TextAlign::TOP_RIGHT, "no data");
          }
        }
      }

  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    id: oled_display
    address: 0x3C
    update_interval: 1s
    lambda: |-
      auto time = id(s_time).now();
      static const char *const DAYS[] = {"Nie", "Pon", "Wto", "Sro", "Czw", "Pia", "Sob"};
      float rssi = id(wifi_rssi).state;
            if (id(show_welcome_screen)) {
        
        it.printf(64, 15, id(font3), TextAlign::TOP_CENTER, "POWER");
        it.printf(64, 30, id(font3), TextAlign::TOP_CENTER, "REGULATOR");
        it.printf(64, 50, id(font1), TextAlign::TOP_CENTER, "Start...");
      } else {
       
        if (id(wifi_rssi).has_state()) {
          // Ikona WiFi (prawa górna)
          int wifi_x = 118;
          if (rssi >= -80) it.filled_rectangle(wifi_x, 2, 2, 2);
          if (rssi >= -70) it.filled_rectangle(wifi_x+3, 1, 2, 3);
          if (rssi >= -60) it.filled_rectangle(wifi_x+6, 0, 2, 4);
          if (rssi >= -50) it.filled_rectangle(wifi_x+9, 0, 2, 5);
        }
        
        if(time.is_valid()) {
          it.strftime(0, 0, id(font1), TextAlign::TOP_LEFT, "%H:%M:%S", time);
          it.printf(95, 0, id(font1), TextAlign::TOP_RIGHT, "%s", DAYS[time.day_of_week - 1]);
        } else {
          it.print(0, 0, id(font1), TextAlign::TOP_LEFT, "Czekam...");
        }
        
       
        // ═══════════════════════════════════════
        // TEMPERATURA I WILGOTNOŚĆ
        // ═══════════════════════════════════════
        
        // ───────────────────────────────────────
        // IKONA TERMOMETRU (większa)
        // ───────────────────────────────────────
        int thermo_x = 10;
        int thermo_y = 18;
        
        // Rurka termometru (szersza i wyższa)
        it.rectangle(thermo_x, thermo_y, 6, 16);
        
        // Linie rtęci wewnątrz
        it.line(thermo_x + 2, thermo_y + 2, thermo_x + 2, thermo_y + 14);
        it.line(thermo_x + 4, thermo_y + 2, thermo_x + 4, thermo_y + 14);
        
        // Bańka na dole (większa)
        it.filled_circle(thermo_x + 3, thermo_y + 18, 4);
        
        // Temperatura - duże cyfry
        if(id(shtc3_temperature).has_state()) {
          it.printf(70, 18, id(font4), TextAlign::TOP_CENTER, "%.1f°C", id(shtc3_temperature).state);
        } else {
          it.print(70, 18, id(font4), TextAlign::TOP_CENTER, "--.-°C");
        }
        
        // ───────────────────────────────────────
        // IKONA KROPLI (większa)
        // ───────────────────────────────────────
        int drop_x = 13;
        int drop_y = 42;
        
        // Górna część kropli (trójkąt)
        it.filled_triangle(
          drop_x, drop_y,           // Wierzchołek
          drop_x - 5, drop_y + 8,   // Lewy dolny
          drop_x + 5, drop_y + 8    // Prawy dolny
        );
        
        // Dolna część kropli (większy okrąg)
        it.filled_circle(drop_x, drop_y + 11, 5);
        
        // Wilgotność - duże cyfry
        if(id(shtc3_humidity).has_state()) {
          it.printf(70, 42, id(font4), TextAlign::TOP_CENTER, "%.0f%%", id(shtc3_humidity).state);
        } else {
          it.print(70, 42, id(font4), TextAlign::TOP_CENTER, "--%");
        }
      }

        

binary_sensor:
  - platform: homeassistant
    id: auto_mode
    entity_id: input_boolean.power_regulator_auto_mode
    internal: true

  - platform: template
    name: "Grzałka Aktywna"
    id: heater_active
    lambda: |-
      return id(heater_on) && id(moc_suwak).state > 0;

  - platform: template
    name: "HA Połączony"
    id: ha_connected_sensor
    device_class: connectivity
    lambda: |-
      return api_is_connected();

  - platform: template
    name: "Alarm Temperatury"
    id: temperature_alarm
    device_class: problem
    lambda: |-
      if (id(shtc3_temperature).has_state() && id(max_temperature).has_state()) {
        return id(shtc3_temperature).state > id(max_temperature).state;
      }
      return false;

  - platform: template
    name: "Watchdog Aktywny"
    id: watchdog_active
    device_class: running
    lambda: |-
      // Aktywny gdy: MANUAL + brak HA + grzałka włączona
      return !id(auto_mode).state && !api_is_connected() && id(moc_suwak).state > 0;

button:
  - platform: template
    name: "Reset Watchdog"
    id: reset_watchdog
    on_press:
      - lambda: |-
          id(manual_watchdog_counter) = 0;
          ESP_LOGI("watchdog", "Watchdog reset by user");

text_sensor:

  # Wifi Info
  - platform: wifi_info
    ip_address:
      name: "IP"
      id: my_ip_adress
    ssid:
      name: "SSID"
      id: wifi_ssid_sensor 
    mac_address:
      name: "MAC" 